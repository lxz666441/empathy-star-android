plugins { id 'com.android.application' }

android {
    namespace 'com.lxz.empathystar'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.lxz.empathystar'
        minSdk 29
        targetSdk 36
        versionCode 65
        versionName '1.55'
        testInstrumentationRunner 'com.lxz.empathystar.DeviceAcceptanceInstrumentation'
    }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
